# Cabeçalhos de segurança das respostas que o próprio nginx dá (mensagens de erro e arquivos
# estáticos). O que vem do painel já traz os dele. Incluído pelo nginx.conf.modelo.
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Resource-Policy same-origin always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
